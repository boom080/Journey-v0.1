services:
  - type: web
    name: journey-staging-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: staging
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: journey-staging-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: SEED_TEST_ACCOUNT
        value: "true"
      - key: TEST_ACCOUNT_EMAIL
        value: demo@journey.local
      - key: TEST_ACCOUNT_USERNAME
        value: journey_demo
      - key: TEST_ACCOUNT_PASSWORD
        sync: false
      - key: AGENT_PROVIDER
        value: mock
      - key: AGENT_API_KEY
        value: ""
      - key: AGENT_API_BASE_URL
        value: ""
      - key: AGENT_DEFAULT_MODEL
        value: journey-deterministic-v1
      - key: AGENT_DAILY_BUDGET_USD
        value: "0"
      - key: AGENT_INPUT_USD_PER_MILLION
        value: "0"
      - key: AGENT_OUTPUT_USD_PER_MILLION
        value: "0"
      - key: SEED_BUILTIN_KNOWLEDGE
        value: "true"

databases:
  - name: journey-staging-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: journey_staging
    user: journey
    ipAllowList: []
