services:
  - type: web
    name: journey-staging-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: staging
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: journey-staging-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: SEED_TEST_ACCOUNT
        value: "false"
      - key: AGENT_PROVIDER
        value: deepseek
      - key: AGENT_EXTERNAL_ENABLED
        value: "false"
      - key: AGENT_PROVIDER_POLICY_URL
        sync: false
      - key: AGENT_PROVIDER_RETENTION_NOTICE
        sync: false
      - key: AGENT_PROVIDER_REVIEW_JSON
        sync: false
      - key: AGENT_DATA_RETENTION_DAYS
        value: "7"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AGENT_DAILY_BUDGET_USD
        value: "0.10"
      - key: AGENT_INPUT_USD_PER_MILLION
        value: "0"
      - key: AGENT_OUTPUT_USD_PER_MILLION
        value: "0"
      - key: SEED_BUILTIN_KNOWLEDGE
        value: "true"

databases:
  - name: journey-staging-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: journey_staging
    user: journey
    ipAllowList: []
