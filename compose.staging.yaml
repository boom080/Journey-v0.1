services:
  db:
    environment:
      POSTGRES_DB: journey_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}

  api:
    environment:
      APP_ENV: staging
      APP_SECRET_KEY: ${STAGING_APP_SECRET_KEY:?Set STAGING_APP_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://journey:${STAGING_POSTGRES_PASSWORD}@db:5432/journey_staging
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-}
      SEED_TEST_ACCOUNT: "false"
      AGENT_PROVIDER: ${STAGING_AGENT_PROVIDER:?Set an approved non-mock STAGING_AGENT_PROVIDER}
      AGENT_EXTERNAL_ENABLED: ${AGENT_EXTERNAL_ENABLED:-false}
      AGENT_PROVIDER_POLICY_URL: ${AGENT_PROVIDER_POLICY_URL:-}
      AGENT_PROVIDER_RETENTION_NOTICE: ${AGENT_PROVIDER_RETENTION_NOTICE:-}
      AGENT_PROVIDER_REVIEW_JSON: ${AGENT_PROVIDER_REVIEW_JSON:-}
      AGENT_DATA_RETENTION_DAYS: ${AGENT_DATA_RETENTION_DAYS:-7}
      AGENT_V2_ENABLED: "true"
      AGENT_V3_ENABLED: "true"
      AGENT_API_KEY: ""
      AGENT_API_BASE_URL: ""
      AGENT_DEFAULT_MODEL: journey-deterministic-v1
      AGENT_DAILY_BUDGET_USD: "0"
      AGENT_INPUT_USD_PER_MILLION: "0"
      AGENT_OUTPUT_USD_PER_MILLION: "0"
      SEED_BUILTIN_KNOWLEDGE: "true"
      FOOD_IMAGE_ANALYSIS_ENABLED: "false"
      FOOD_IMAGE_PROVIDER: mock
      FOOD_IMAGE_EXTERNAL_UPLOAD_CONFIRMED: "false"
