[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-api"
version = "0.1.0"
description = "Journey modular monolith API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<1.19",
  "bcrypt>=4.1,<5",
  "fastapi>=0.128,<0.129",
  "httpx>=0.28,<0.29",
  "langchain>=1.3.14,<1.4",
  "langchain-litellm==0.7.0",
  "langgraph>=1.2.9,<1.3",
  "litellm==1.86.2",
  "opentelemetry-api>=1.43,<1.44",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.13,<2.14",
  "python-jose>=3.5,<3.6",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.39,<0.40",
]

[project.optional-dependencies]
dev = [
  "allure-pytest==2.16.0",
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
  "pytest-cov>=7.1,<7.2",
  "requests>=2.34,<3",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
