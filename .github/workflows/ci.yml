name: Journey CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journey-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_PROVIDER: mock
  AGENT_API_KEY: ""
  AGENT_API_BASE_URL: ""
  AGENT_DAILY_BUDGET_USD: "0"
  AGENT_INPUT_USD_PER_MILLION: "0"
  AGENT_OUTPUT_USD_PER_MILLION: "0"
  EXPO_NO_TELEMETRY: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: journey_test
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: local-journey-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey -d journey_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      APP_SECRET_KEY: local-test-secret-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://journey:local-journey-db-password@127.0.0.1:5432/journey_test
      SEED_TEST_ACCOUNT: "false"
      SEED_BUILTIN_KNOWLEDGE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Assert zero-key deterministic CI
        run: |
          test "$AGENT_PROVIDER" = mock
          test -z "$AGENT_API_KEY"
          test "$AGENT_DAILY_BUDGET_USD" = 0
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Ruff
        run: |
          ruff check --no-cache backend evals
          ruff format --check --no-cache backend evals
      - name: Alembic upgrade downgrade check
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade 0002_core_api
          alembic upgrade head
          alembic check
      - name: Backend tests and coverage
        working-directory: backend
        run: |
          mkdir -p ../reports/backend/allure-results
          python -m pytest -q -p no:cacheprovider tests ../evals/test_*.py \
            --junitxml=../reports/backend/junit.xml \
            --alluredir=../reports/backend/allure-results \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:../reports/backend/coverage.xml \
            --cov-fail-under=70
      - name: Requests Pytest Allure network black-box
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../reports/backend/blackbox-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && break
            if [ "$attempt" = 30 ]; then cat ../reports/backend/blackbox-api.log; exit 1; fi
            sleep 1
          done
          BLACKBOX_BASE_URL=http://127.0.0.1:8000 python -m pytest -q -p no:cacheprovider blackbox_tests \
            --junitxml=../reports/backend/blackbox-junit.xml \
            --alluredir=../reports/backend/blackbox-allure-results
      - name: Agent and RAG quantitative gates
        run: |
          mkdir -p reports/evals
          PYTHONPATH=backend python evals/run_evals.py \
            --output reports/evals/latest.json --enforce
          PYTHONPATH=backend AGENT_PROVIDER=mock python evals/run_rag_eval.py \
            --mode mock --config rag-v1 \
            --output reports/evals/rag-v1.json --enforce
          PYTHONPATH=backend AGENT_PROVIDER=mock python evals/run_rag_eval.py \
            --mode mock --config rag-v2-candidate \
            --baseline reports/evals/rag-v1.json \
            --output reports/evals/rag-v2-candidate.json --enforce
      - name: Docker production and test targets
        run: |
          docker build --target test -t journey-api-test -f backend/Dockerfile .
          docker build --target runtime -t journey-api -f backend/Dockerfile .
      - name: Staging Compose contract
        env:
          STAGING_POSTGRES_PASSWORD: ci-staging-db-password
          STAGING_APP_SECRET_KEY: ci-staging-app-secret-at-least-32-characters
          STAGING_TEST_ACCOUNT_PASSWORD: ci-staging-test-password
        run: docker compose -f compose.yaml -f compose.staging.yaml config --quiet
      - name: Production Compose and Caddy contracts
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
          docker run --rm \
            -e SERVER_DOMAIN=journey.example.com \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-and-eval-reports
          path: reports/
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Mobile logic and component tests
        run: |
          npm run test:logic --workspace @journey/mobile
          npm run test:ci --workspace @journey/mobile
      - name: Typecheck and lint
        run: |
          npm run mobile:typecheck
          npm run mobile:lint
          node infra/verify_app_variants.mjs
      - name: Web and native JS bundle checks
        working-directory: apps/mobile
        run: |
          npm run web:build
          npx expo export --platform ios --output-dir dist-ios
          npx expo export --platform android --output-dir dist-android
      - name: Web runtime image
        run: |
          docker build -f infra/web/Dockerfile \
            --build-arg APP_VARIANT=production \
            --build-arg EXPO_PUBLIC_API_BASE_URL=https://journey.example.com \
            -t journey-web-ci .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-test-and-web-build
          path: |
            apps/mobile/reports/
            apps/mobile/coverage/
            apps/mobile/dist/
          if-no-files-found: error

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated API and database
        env:
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
        run: |
          docker compose up -d --build
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && break
            if [ "$attempt" = 60 ]; then docker compose logs --no-color; exit 1; fi
            sleep 1
          done
      - name: Export Web
        env:
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run mobile:web:build
      - name: Core browser E2E
        run: npm run mobile:e2e:web
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose without deleting volume
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-e2e-report
          path: apps/mobile/reports/
          if-no-files-found: warn
