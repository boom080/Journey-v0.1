<svg xmlns="http://www.w3.org/2000/svg"
     width="90mm"
     height="50mm"
     viewBox="0 0 900 500"
     role="img"
     aria-labelledby="title description">
  <title id="title">Journey 9 by 5 centimeter food scale reference card</title>
  <description id="description">
    A printable high contrast checkerboard card with no personal information.
  </description>
  <defs>
    <pattern id="checker" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#ffffff"/>
      <rect width="50" height="50" fill="#111111"/>
      <rect x="50" y="50" width="50" height="50" fill="#111111"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="892" height="492" rx="18" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <rect x="20" y="20" width="460" height="460" fill="url(#checker)" stroke="#111111" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="520" y="120" font-size="58" font-weight="700">Journey</text>
    <text x="520" y="180" font-size="30">FOOD SCALE CARD</text>
    <line x1="520" y1="220" x2="850" y2="220" stroke="#111111" stroke-width="5"/>
    <text x="520" y="285" font-size="46" font-weight="700">90 × 50 mm</text>
    <text x="520" y="345" font-size="28">PRINT AT 100%</text>
    <text x="520" y="400" font-size="24">NO PERSONAL DATA</text>
    <text x="520" y="445" font-size="20">Keep flat beside the food</text>
  </g>
</svg>
